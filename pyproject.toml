[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "meta-ads-manager"
version = "0.2.0"
description = "Portable Meta Ads analysis tools for LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
pdf = ["reportlab>=4.4,<5", "pypdf>=5,<7", "pypdfium2>=4.30,<6"]

[project.scripts]
meta-ads = "meta_ads_manager.cli:main"
meta-ads-workspace = "meta_ads_manager.workspace:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/meta_ads_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
